# iOS builds on Codemagic, for when GitHub Actions' macOS runners aren't
# available. Same build as the Release workflow's `ios-unsigned` job: an
# unsigned IPA for sideloading (SideStore / AltStore / Sideloadly re-sign it
# with your own Apple ID).
#
# Manual only - start it from the Codemagic dashboard (Start new build ->
# ios-unsigned, pick the branch). The free plan's macOS minutes are limited
# and a build takes about 10, so it never runs on its own. Tests aren't run
# here: `flutter test` runs locally before every commit.
workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      # Pinned to the version `flutter test` runs on locally: 3.50.0
      # (stable on 2026-11-19) built an IPA that never got past the launch
      # screen. Bump it together with the local SDK.
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build (no code signing)
        script: |
          flutter build ios --release --no-codesign --build-number=$BUILD_NUMBER
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr ShaddaiReader-unsigned.ipa Payload
    artifacts:
      - ShaddaiReader-unsigned.ipa
